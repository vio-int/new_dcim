version: '3.8'

services:
  # PHP Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dcim-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    networks:
      - dcim-network
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=dcim
      - DB_USER=dcim
      - DB_PASS=dcim_secret
      - PHP_ENV=development

  # Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: dcim-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dcim-network
    depends_on:
      - app

  # Database (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: dcim-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: dcim
      MYSQL_USER: dcim
      MYSQL_PASSWORD: dcim_secret
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - dcim-network
    command: --default-authentication-plugin=mysql_native_password

  # PHPMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dcim-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - dcim-network
    depends_on:
      - db

  # Node.js API Server (PoC)
  node-api:
    build:
      context: ./poc/backend
      dockerfile: Dockerfile
    container_name: dcim-node-api
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - PORT=3000
      - WS_PORT=3001
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=dcim
      - DB_PASSWORD=dcim_secret
      - DB_NAME=dcim
      - JWT_SECRET=dcim-poc-secret-key-change-in-production
      - JWT_EXPIRES_IN=24h
      - NODE_ENV=development
    networks:
      - dcim-network
    depends_on:
      - db
    volumes:
      - ./poc/backend/src:/app/src
      - /app/node_modules

  # Vue.js Frontend (PoC)
  vue-frontend:
    build:
      context: ./poc/frontend
      dockerfile: Dockerfile
    container_name: dcim-vue-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_WS_URL=ws://localhost:3001
    networks:
      - dcim-network
    depends_on:
      - node-api
    volumes:
      - ./poc/frontend/src:/app/src
      - /app/node_modules

volumes:
  db_data:

networks:
  dcim-network:
    driver: bridge
